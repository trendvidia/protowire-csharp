# Do not run `buf generate` by hand: it writes to .generated/ (gitignored),
# and nothing compiles from there. tool/generate.sh runs it, moves every
# file to the project that compiles it, and prepends the SPDX header;
# `tool/generate.sh --check` is what CI runs (#24).
version: v2
