#
# Do not run `buf generate` by hand: it writes to .generated/ (gitignored),
# and nothing compiles from there. tool/generate.sh runs it, moves every
# file to the project that compiles it, and prepends the SPDX header;
# `tool/generate.sh --check` is what CI runs (#24).
version: v2
managed:
  enabled: true
  override:
    - file_option: csharp_namespace
      value: Protowire.Envelopes.V1
      path: envelope/v1/envelope.proto
    - file_option: csharp_namespace
      value: Protowire.Pxf
      path: pxf/bignum.proto
    - file_option: csharp_namespace
      value: Protowire.Pxf
      path: pxf/annotations.proto
    - file_option: csharp_namespace
      value: Protowire.Sbe
      path: sbe/annotations.proto
    - file_option: csharp_namespace
      value: Protowire.Sbe.Tests.Bench
      path: sbe-bench.proto
    - file_option: csharp_namespace
      value: Protowire.Sbe.Tests.Bench
      path: sbe-extra.proto
    - file_option: csharp_namespace
      value: Protowire.Sbe.Tests.Bench
      path: sbe-oneof.proto
    - file_option: csharp_namespace
      value: Protowire.Pxf.Tests.Bench
      path: bench-test.proto
    - file_option: csharp_namespace
      value: Protowire.Pxf.Tests.Presence
      path: pxf-presence-test.proto
    - file_option: csharp_namespace
      value: Protowire.DumpEnvelope.Fixtures
      path: settings.proto
plugins:
  - remote: buf.build/protocolbuffers/csharp:v29.3
    out: .generated
    opt: base_namespace=Protowire
