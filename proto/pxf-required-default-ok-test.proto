// (pxf.required) = false requires nothing, so a default beside it stands.
syntax = "proto3";
package required_default.v1;

import "pxf/annotations.proto";

message NotRequiredWithDefault {
  string f = 1 [(pxf.required) = false, (pxf.default) = "x"];
}
