// Messages that hold a pxf.Secret in every position Decoder.OnSecretField
// reports: singular, list element, map value, nested body and Any body.
// SecretDemo mirrors secret_test.go and Root mirrors eq_block_presence_test.go
// in protowire-go/encoding/pxf. Loaded by Protowire.Pxf.Tests.SecretHookTests.
syntax = "proto3";
package secrethook.v1;

import "google/protobuf/any.proto";
import "pxf/secret.proto";

message SecretDemo {
  string base_url = 1;
  pxf.Secret db_password = 2;
  pxf.Secret api_token = 3;
  repeated pxf.Secret backup_keys = 4;
  map<string, pxf.Secret> tenant_keys = 5;
  map<int32, pxf.Secret> by_id = 6;
}

message DB {
  pxf.Secret password = 1;
}

message Holder {
  pxf.Secret pw = 1;
}

message Root {
  DB db = 1;
  repeated DB servers = 2;
  map<string, DB> by_host = 3;
  google.protobuf.Any payload = 4;
  map<string, pxf.Secret> tenant_keys = 5;
  pxf.Secret pw = 6;
}
